name: checks

on:
  pull_request:
  workflow_dispatch:

jobs:
  changed-code:
    name: changed code passes ruff, format, complexity and mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.5"
      - run: uv sync --group dev
      - name: changed code (ruff, format, complexity, mypy)
        run: uv run python tools/quality_gate.py --checks code --base "${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || 'HEAD~1' }}"
      - name: import direction (.importlinter, whole tree)
        if: ${{ !cancelled() }}
        run: uv run python tools/quality_gate.py --checks imports

  fast-tests:
    name: fast tests and page logic
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.5"
      - run: uv sync --group dev
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      # Signal's tests check every snapshot with the real React reader (bundled by web's esbuild);
      # under CI=true they fail, not skip, when it is missing.
      - run: npm --prefix web ci
      - name: Issuer library Node tests
        run: >-
          node --test
          apps/issuer-library/credit_os/web/reader.test.cjs
          apps/issuer-library/credit_os/web/static.test.cjs
          apps/issuer-library/credit_os/web/calendar.test.cjs
          apps/issuer-library/credit_os/web/changes.test.cjs
          apps/issuer-library/credit_os/web/components.test.cjs
          apps/issuer-library/credit_os/web/events-maps.test.cjs
          apps/issuer-library/credit_os/web/evidence.test.cjs
      - name: pytest (known failures deselected)
        run: |
          deselect=$(sed -e 's/#.*//' -e '/^\s*$/d' tests/known-failures.txt | awk '{print "--deselect=" $1}')
          uv run pytest -q -p no:cacheprovider -m "not live and not browser" $deselect \
            tests/test_document_key.py tests/test_synthetic_market_data.py \
            tests/test_library_index.py tests/test_update_library.py \
            tests/test_issuer_library_packaging.py tests/test_reader_summary.py \
            tests/test_credit_os_catalogue.py tests/test_credit_os_store.py \
            tests/test_repo_rules.py tests/test_dev_*.py \
            tests/test_cpos_launch.py tests/test_cpos_facilities.py tests/test_cpos_periods.py \
            tests/test_cpos_scale.py tests/model \
            tests/test_credit_os_chips.py tests/test_quality_gate.py tests/test_work_pc_delta.py \
            tests/test_inbox_activity.py tests/test_inbox_filing.py \
            tests/test_inbox_layout.py tests/test_inbox_runs.py tests/test_inbox_scheduler.py \
            tests/test_run_start_submissions.py tests/test_run_start_prior.py \
            tests/test_run_start_scheduler.py \
            tests/test_run_start_service.py \
            tests/test_context_module_options.py \
            tests/test_handoff_loop.py tests/test_handoff_transport.py \
            tests/test_deploy_vii_context.py \
            tests/test_library_reader_refs.py \
            tests/test_changes.py tests/test_citation_markers.py \
            tests/test_web_search_scope.py tests/test_prose_checks.py \
            tests/test_confidence.py tests/test_method_scripts.py \
            tests/test_method_scripts_rest.py tests/test_cpos_register_scope.py \
            tests/test_http_base.py tests/test_methodology_selection.py \
            tests/test_portfolio_workbook.py tests/test_portfolio_export.py \
            tests/test_reference_portfolios.py tests/test_reference_fetch.py \
            tests/test_pathway_tiers.py \
            tests/test_react_*.py proof/test_launcher.py \
            tests/test_signal_*.py \
            tests/test_accounts_*.py \
            tests/test_auth_*.py \
            tests/test_publication_reuse.py tests/test_cpos_parallel.py

  web:
    name: connected application (lint, types, tests, build)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: identify changes that can affect the rendered application
        id: browser
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [[ -z "$BASE" ]] || ! git diff --quiet "$BASE" HEAD -- web src react_frontend apps proof prompts pyproject.toml uv.lock .github/workflows/checks.yml; then
            echo "connected=true" >> "$GITHUB_OUTPUT"
          fi
          if [[ -z "$BASE" ]] || ! git diff --quiet "$BASE" HEAD -- tools/dev_dashboard.py tools/dev_dashboard tools/dev_ledger.py web/scripts/dev-dashboard-proof.mjs .github/workflows/checks.yml; then
            echo "dashboard=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm --prefix web ci
      - run: npm --prefix web run lint
      - run: npm --prefix web run format:check
      - run: npm --prefix web run typecheck
      - run: npm --prefix web run unused
      - run: npm --prefix web run duplication
      - run: npm --prefix web test
      - run: npm --prefix web run build
      - run: npm --prefix web run test:scripts

      - uses: astral-sh/setup-uv@v5
        if: steps.browser.outputs.connected == 'true' || steps.browser.outputs.dashboard == 'true'
        with:
          version: "0.12.5"
      - name: prepare locked Python and browser dependencies
        if: steps.browser.outputs.connected == 'true' || steps.browser.outputs.dashboard == 'true'
        run: |
          uv sync --frozen --group dev
          if ! command -v google-chrome || ! command -v microsoft-edge; then
            (cd web && node_modules/.bin/playwright install --with-deps chrome msedge)
          fi
      - name: run the connected workflow in live Chrome and Edge
        if: steps.browser.outputs.connected == 'true'
        run: npm --prefix web run proof:connected
      - name: run the development dashboard in live Chrome and Edge
        if: steps.browser.outputs.dashboard == 'true'
        run: |
          mkdir -p proof-artifacts/dev-dashboard
          CREDIT_OS2_DASHBOARD_PROOF=proof-artifacts/dev-dashboard node web/scripts/dev-dashboard-proof.mjs
      - name: retain synthetic browser results
        if: always() && (steps.browser.outputs.connected == 'true' || steps.browser.outputs.dashboard == 'true')
        uses: actions/upload-artifact@v4
        with:
          name: connected-browser-proof-${{ github.sha }}
          path: |
            proof-artifacts/run-*/*.json
            proof-artifacts/run-*/*.png
            proof-artifacts/dev-dashboard
          if-no-files-found: warn
          retention-days: 7

  secrets:
    name: gitleaks over tracked files
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: install gitleaks 8.30.1 (pinned, checksum verified)
        run: |
          dir=$(mktemp -d)
          curl -fsSL --retry 3 --retry-all-errors -o "$dir/gitleaks.tar.gz" https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $dir/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$dir/gitleaks.tar.gz" -C "$dir" gitleaks
          sudo install -m 0755 "$dir/gitleaks" /usr/local/bin/gitleaks
      - run: bash tools/gitleaks_tracked.sh
      - name: gitleaks over the PR's commits (a secret added then removed)
        if: ${{ github.event_name == 'pull_request' }}
        env:
          BASE: ${{ github.base_ref }}
        run: bash tools/gitleaks_pr_history.sh
